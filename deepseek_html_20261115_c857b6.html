<title>Василиса: Империя v3</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #05030a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; user-select: none; touch-action: manipulation; }
  
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 520px; margin: 0 auto; position: relative; overflow: hidden; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #app.night { background: linear-gradient(180deg, #150e2a 0%, #05030a 100%); }
  
  #fx-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  .header { padding: 12px 18px 6px; text-align: center; position: relative; z-index: 10; }

  .progress { height: 6px; border-radius: 6px; background: rgba(255,255,255,0.1); margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; border-radius: 6px; background: linear-gradient(90deg, #ff8ac4, #ffd966); box-shadow: 0 0 15px rgba(255,138,196,0.8); transition: width 0.4s; }
  .hdr-btn { position: absolute; width: 36px; height: 36px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 15; backdrop-filter: blur(10px); }
  #soundBtn { right: 14px; top: 10px; }
  #musicBtn { right: 58px; top: 10px; }

  .score-area { text-align: center; padding: 6px 18px 0; z-index: 10; }
  .score-value { font-size: 48px; font-weight: 900; letter-spacing: -1.5px; line-height: 1; background: linear-gradient(180deg, #fff, #e0c8ff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 25px rgba(167,139,255,0.6)); transition: transform 0.08s; }
  .score-value.bump { transform: scale(1.1); }
  .score-label { font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
  .badges { display: flex; gap: 6px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
  .badge { padding: 4px 12px; font-size: 12px; font-weight: 800; border-radius: 20px; backdrop-filter: blur(5px); }
  .badge-passive { color: #7effc0; background: rgba(126,255,192,0.15); border: 1px solid rgba(126,255,192,0.3); }
  .badge-stars { color: #ffd966; background: rgba(255,217,102,0.15); border: 1px solid rgba(255,217,102,0.3); display: none; }
  .badge-combo { color: #ff8ac4; background: rgba(255,138,196,0.15); border: 1px solid rgba(255,138,196,0.3); display: none; }

  .tap-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 5; padding-bottom: 20px; }

  .cat-wrapper { position: absolute; bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 10; transition: all 0.4s; width: 90px; }
  .cat-wrapper.left { left: 10px; }
  .cat-wrapper.right { right: 10px; }
  .cat-wrapper.hidden { opacity: 0; transform: scale(0.5); pointer-events: none; }
  .cat { width: 75px; height: 95px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8)) drop-shadow(0 0 5px rgba(255,255,255,0.3)); animation: catIdle 3.5s infinite; }
  @keyframes catIdle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .cat.bounce { animation: catBounce 0.3s; }
  @keyframes catBounce { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-15px) scale(1.1); } 100% { transform: translateY(0) scale(1); } }
  .cat-btn { padding: 6px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.6); color: #fff; font-size: 10px; font-weight: 800; cursor: pointer; backdrop-filter: blur(5px); transition: all 0.2s; width: 100%; text-align: center; }
  .cat-btn:active { transform: scale(0.9); }
  .cat-btn.active { background: #ffd966; color: #000; border-color: #ffd966; box-shadow: 0 0 20px #ffd966; }

  .tap-btn-container { position: relative; width: min(65vw, 260px); height: min(65vw, 260px); display: flex; align-items: center; justify-content: center; }
  .tap-btn-glow { position: absolute; inset: -20px; border-radius: 50%; background: radial-gradient(circle, rgba(167,139,255,0.6) 0%, transparent 70%); filter: blur(20px); z-index: 0; pointer-events: none; animation: glowPulse 3s infinite; }
  @keyframes glowPulse { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.05); opacity: 1; } }
  .tap-btn { position: relative; width: 100%; height: 100%; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); box-shadow: 0 0 0 6px rgba(167,139,255,0.1), 0 0 50px rgba(167,139,255,0.5), inset 0 0 40px rgba(255,255,255,0.1); cursor: pointer; transition: transform 0.08s; z-index: 1; background: transparent; overflow: hidden; }
  .tap-btn-inner { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 30%, rgba(123,92,255,0.4) 0%, rgba(20,10,40,0.9) 70%, #0a0615 100%); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; }
  .tap-btn:active { transform: scale(0.94); }
  .tap-btn.lvl-1 { box-shadow: 0 0 0 6px rgba(167,139,255,0.2), 0 0 60px rgba(167,139,255,0.8); border-color: rgba(167,139,255,0.6); }
  .tap-btn.lvl-2 { box-shadow: 0 0 0 6px rgba(255,138,196,0.2), 0 0 70px rgba(255,138,196,0.8); border-color: rgba(255,138,196,0.8); }
  .tap-btn.lvl-3 { box-shadow: 0 0 0 6px rgba(255,217,102,0.2), 0 0 80px rgba(255,217,102,0.9); border-color: rgba(255,217,102,1); }
  .tap-btn.mania { animation: maniaPulse 0.4s infinite; }
  @keyframes maniaPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(255,184,0,0.3), 0 0 80px rgba(255,184,0,1); } }

  .chars { display: flex; align-items: flex-end; justify-content: center; width: 100%; height: 100%; }
  .char { display: flex; align-items: flex-end; justify-content: center; transition: all 0.4s; }
  .char svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.7)); }
  .char-v { width: 68%; height: 92%; }
  .char-s { width: 0; height: 90%; opacity: 0; transform: scale(0.6) translateY(10px); }
  .duo .char-v { width: 52%; height: 92%; }
  .duo .char-s { width: 48%; opacity: 1; transform: scale(1) translateY(0); }
  .char.bounce { animation: charBounce 0.28s ease-out; }
  @keyframes charBounce { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-12px) scale(1.04); } 100% { transform: translateY(0) scale(1); } }

  /* ============ SKIN VISIBILITY RULES ============ */

  /* Vasilisa default = schoolgirl */

  /* Vasilisa student */

  .char-v.skin-v-1 .dress { display: block; fill: url(#v-dress-blue); }
  .char-v.skin-v-1 .acc-glasses { display: block; }
  .char-v.skin-v-1 .legs-clothes.jeans { display: block; }
  .char-v.skin-v-1 .shoes.sneakers { display: block; }
  .char-v.skin-v-1 .shoes.sneakers .shoe-color { fill: #e63939; }

  /* Vasilisa CEO */

  .char-v.skin-v-2 .dress { display: block; fill: url(#v-dress-black); }
  .char-v.skin-v-2 .acc-tie { display: block; }
  .char-v.skin-v-2 .legs-clothes.tights-black { display: block; }
  .char-v.skin-v-2 .shoes.heels { display: block; }

  /* Vasilisa mermaid */

  .char-v.skin-v-3 .swimwear { display: block; }

  /* Vasilisa queen */
  .char-v.skin-v-4 .hair-back, .char-v.skin-v-4 .hair-front { display: block; fill: url(#v-hair-blonde); }
  .char-v.skin-v-4 .dress { display: block; fill: url(#v-dress-red); }

  .char-v.skin-v-4 .cape { display: block; }

  /* Sasha skins */
  .char-s .shirt { display: none; }
  .char-s.skin-s-0 .hair { display: block; fill: url(#s-hair-brown); }
  .char-s.skin-s-0 .shirt { display: block; fill: url(#s-shirt-blue); }
  .char-s.skin-s-0 .acc-drip { display: block; }
  .char-s.skin-s-0 .legs-clothes.pants { display: block; fill: #3a4a6b; }
  .char-s.skin-s-0 .shoes.sneakers { display: block; }
  .char-s.skin-s-0 .shoes.sneakers .shoe-color { fill: #fff; }

  .char-s.skin-s-1 .hair { display: block; fill: url(#s-hair-brown); }
  .char-s.skin-s-1 .shirt { display: block; fill: url(#s-shirt-dark); }
  .char-s.skin-s-1 .acc-tie { display: block; }

  .char-s.skin-s-2 .hair { display: block; fill: url(#s-hair-brown); }
  .char-s.skin-s-2 .shirt { display: block; fill: url(#s-shirt-red); }

  .char-s.skin-s-3 .hair { display: block; fill: url(#s-hair-brown); }
  .char-s.skin-s-3 .shirt { display: block; fill: url(#s-shirt-purple); }
  .char-s.skin-s-3 .acc-crown { display: block; }
  .char-s.skin-s-3 .cape { display: block; }
  .char-s.skin-s-3 .legs-clothes.pants { display: block; fill: #5a1a8b; }
  .char-s.skin-s-3 .shoes.gold-oxfords { display: block; }

  .cat .acc-collar, .cat .acc-sweater { display: none; }
  .cat.skin-cat-1 .acc-collar { display: block; }
  .cat.skin-tasik-1 .acc-sweater { display: block; }

  .bubble { position: absolute; top: 10px; left: 50%; transform: translate(-50%, -10px) scale(0.8); padding: 8px 14px; border-radius: 16px; background: #fff; color: #1a0f2e; font-size: 13px; font-weight: 800; white-space: nowrap; opacity: 0; pointer-events: none; box-shadow: 0 10px 20px rgba(0,0,0,0.4); z-index: 60; transition: all 0.2s; }
  .bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .mania-timer { position: absolute; top: 10px; right: 10px; padding: 5px 12px; border-radius: 12px; background: linear-gradient(135deg, #ffb800, #ff6b00); font-weight: 900; font-size: 12px; box-shadow: 0 0 20px rgba(255,184,0,0.8); z-index: 60; opacity: 0; transition: opacity 0.2s; }
  .mania-timer.active { opacity: 1; }

  .golden { position: absolute; width: 65px; height: 65px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8c0, #ffb800 55%, #c47a00 100%); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; color: #4a2500; box-shadow: 0 0 40px rgba(255,184,0,0.9); z-index: 100; cursor: pointer; transform: translate(-50%, -50%); animation: goldenFloat 4s forwards; }
  @keyframes goldenFloat { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0) rotate(-180deg); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.2) rotate(0deg); } 25% { transform: translate(-50%, -50%) scale(1) rotate(10deg); } 75% { transform: translate(-50%, -50%) scale(1) rotate(-10deg); } 90% { opacity: 1; transform: translate(-50%, -50%) scale(1.05) rotate(0deg); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.5) rotate(0deg); } }

  .combo-indicator { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 900; color: #ffd966; opacity: 0; pointer-events: none; z-index: 55; text-shadow: 0 0 20px #ffb800, 0 0 40px #ff6b00; white-space: nowrap; }
  .combo-indicator.show { animation: comboPop 0.7s ease-out; }
  @keyframes comboPop { 0% { opacity: 0; transform: translateX(-50%) scale(0.5); } 25% { opacity: 1; transform: translateX(-50%) scale(1.3) translateY(-10px); } 100% { opacity: 0; transform: translateX(-50%) scale(1) translateY(-50px); } }
  .double-chicken { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; font-weight: 900; color: #ff3d3d; text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff; z-index: 200; pointer-events: none; white-space: nowrap; animation: chickenPop 0.8s forwards; }
  @keyframes chickenPop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(-15deg); } 30% { opacity: 1; transform: translate(-50%, -50%) scale(1.4) rotate(5deg); } 70% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); } }

  /* ============ PANEL & BIGGER TABS ============ */
  .panel { position: relative; z-index: 20; background: rgba(15, 10, 30, 0.95); backdrop-filter: blur(25px); border-top: 1px solid rgba(255,255,255,0.1); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; height: 42vh; min-height: 230px; box-shadow: 0 -10px 40px rgba(0,0,0,0.8); }
  .tabs { display: flex; gap: 3px; padding: 10px 4px 6px; flex-shrink: 0; overflow-x: auto; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 1; min-width: 58px; padding: 8px 4px 6px; border: none; border-radius: 10px; background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.55); cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tab .tab-icon { font-size: 24px; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }
  .tab .tab-label { font-size: 9px; font-weight: 900; letter-spacing: 0.3px; text-transform: uppercase; }
  .tab.active { background: linear-gradient(135deg, #7b5cff, #b44cff); color: #fff; box-shadow: 0 4px 15px rgba(123,92,255,0.5); }
  .tab.active .tab-icon { filter: drop-shadow(0 2px 6px rgba(255,255,255,0.7)); transform: scale(1.1); }
  .tab-body { flex: 1; overflow-y: auto; padding: 4px 14px 24px; }
  .tab-body::-webkit-scrollbar { width: 4px; }
  .tab-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  .item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 8px; }
  .item.affordable { background: rgba(126,255,192,0.06); border-color: rgba(126,255,192,0.2); }
  .item-icon { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-desc { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 2px; }
  .item-lvl { font-size: 10px; color: #a78bff; font-weight: 800; margin-top: 2px; }
  .buy-btn { flex-shrink: 0; padding: 8px 12px; border-radius: 10px; border: none; font-size: 11px; font-weight: 900; color: #1a0f2e; background: linear-gradient(135deg, #ffd966, #ffb347); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .buy-btn:active { transform: scale(0.93); }
  .buy-btn.disabled { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.3); cursor: default; }

  .skin-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .skin-card { padding: 10px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); text-align: center; }
  .skin-card.owned { border-color: rgba(126,255,192,0.3); background: rgba(126,255,192,0.05); }
  .skin-card.active { border-color: #ffd966; box-shadow: 0 0 15px rgba(255,217,102,0.3); }
  .skin-title { font-size: 11px; font-weight: 800; margin-bottom: 6px; }
  .skin-preview { font-size: 32px; margin-bottom: 6px; line-height: 1; }
  .skin-btn { width: 100%; padding: 6px; border-radius: 8px; border: none; font-size: 10px; font-weight: 800; cursor: pointer; background: rgba(255,255,255,0.1); color: #fff; }
  .skin-btn.buy { background: linear-gradient(135deg, #ffd966, #ffb347); color: #1a0f2e; }
  .skin-btn.stars { background: linear-gradient(135deg, #7b5cff, #b44cff); color: #fff; }
  .skin-btn.active { background: #ffd966; color: #1a0f2e; }

  .quest { display: flex; gap: 10px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 8px; align-items: center; }
  .quest-icon { font-size: 24px; }
  .quest-info { flex: 1; }
  .quest-name { font-size: 12px; font-weight: 800; margin-bottom: 4px; }
  .quest-bar { height: 6px; border-radius: 6px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .quest-fill { height: 100%; background: linear-gradient(90deg, #7b5cff, #b44cff); border-radius: 6px; }
  .quest-reward { font-size: 10px; color: #ffd966; font-weight: 800; margin-top: 4px; }
  .quest.done { opacity: 0.5; }
  .quest-claim { padding: 6px 10px; border-radius: 8px; border: none; background: #ffd966; color: #1a0f2e; font-weight: 800; font-size: 10px; cursor: pointer; }

  .rebirth-hero { text-align: center; padding: 16px 12px; background: radial-gradient(circle at 50% 30%, rgba(255,217,102,0.15), transparent 70%); border-radius: 16px; margin-bottom: 10px; border: 1px solid rgba(255,217,102,0.2); }
  .rebirth-stars { font-size: 44px; font-weight: 900; line-height: 1; background: linear-gradient(180deg, #fff8c0, #ffd966, #ffb800); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rebirth-label { font-size: 11px; color: rgba(255,255,255,0.5); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; }
  .rebirth-mult { font-size: 14px; font-weight: 800; color: #7effc0; margin-top: 8px; }

  .rebirth-btn { display: block; width: 100%; padding: 14px; border-radius: 14px; border: none; font-size: 15px; font-weight: 900; background: linear-gradient(135deg, #ffb800, #ff6b00); color: #fff; cursor: pointer; margin-top: 16px; }
  .rebirth-btn.disabled { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.3); cursor: default; }
  .rebirth-info { font-size: 11px; color: rgba(255,255,255,0.4); line-height: 1.5; margin-top: 12px; text-align: center; }
  .rebirth-stats { display: flex; gap: 8px; margin-top: 10px; }
  .rebirth-stat { flex: 1; padding: 10px 8px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); text-align: center; }
  .rebirth-stat-val { font-size: 16px; font-weight: 900; color: #ffd966; }

  .story-item { padding: 12px 14px; border-radius: 14px; margin-bottom: 8px; background: rgba(255,255,255,0.03); border-left: 3px solid rgba(167,139,255,0.6); }

  .bet-row { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; }
  .bet-input { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); color: #fff; font-size: 13px; font-weight: 800; font-family: inherit; min-width: 0; }

  .wheel-wrap { position: relative; width: 160px; height: 160px; margin: 10px auto 20px; }
  .wheel { width: 100%; height: 100%; border-radius: 50%; border: 3px solid #ffd966; position: relative; box-shadow: 0 0 30px rgba(255,184,0,0.6), inset 0 0 20px rgba(0,0,0,0.5); background: conic-gradient(#555 0deg 36deg, #666 36deg 90deg, #888 90deg 162deg, #7effc0 162deg 198deg, #ffd966 198deg 216deg, #ff8ac4 216deg 230deg, #a78bff 230deg 244deg, #ff3d3d 244deg 252deg, #555 252deg 360deg); }

  .coin-result { text-align: center; font-size: 16px; font-weight: 900; min-height: 20px; }

  .slots { display: flex; gap: 6px; justify-content: center; margin: 15px 0; }

  .mines-result { text-align: center; font-size: 15px; font-weight: 900; min-height: 20px; margin-top: 10px; }

  .streak-wrap { padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 10px; }
  .streak-title { font-size: 13px; font-weight: 800; color: #ffd966; margin-bottom: 8px; }
  .streak-bar { display: flex; gap: 4px; margin: 8px 0; }
  .streak-day { flex: 1; padding: 8px 2px; border-radius: 8px; background: rgba(255,255,255,0.05); text-align: center; font-size: 9px; font-weight: 800; color: rgba(255,255,255,0.4); }
  .streak-day.claimed { background: rgba(126,255,192,0.2); color: #7effc0; }
  .streak-day.today { background: rgba(255,217,102,0.3); color: #ffd966; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,217,102,0.5); } 50% { box-shadow: 0 0 0 8px rgba(255,217,102,0); } }
  .streak-claim { width: 100%; padding: 10px; border-radius: 10px; border: none; background: linear-gradient(135deg, #ffd966, #ffb347); color: #1a0f2e; font-size: 13px; font-weight: 900; cursor: pointer; margin-top: 6px; }
  .streak-claim:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); cursor: default; }

  .toast { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.7); padding: 16px 28px; border-radius: 20px; background: linear-gradient(135deg, rgba(123,92,255,0.95), rgba(180,76,255,0.95)); color: #fff; font-weight: 900; font-size: 16px; text-align: center; opacity: 0; pointer-events: none; z-index: 300; border: 1px solid rgba(255,255,255,0.3); }
  .toast.show { animation: toastIn 2.2s forwards; }
  .toast .t-small { font-size: 10px; font-weight: 700; opacity: 0.8; margin-bottom: 4px; letter-spacing: 1.5px; text-transform: uppercase; }
  .toast.gold { background: linear-gradient(135deg, rgba(255,184,0,0.95), rgba(255,107,0,0.95)); }
  .toast.ach { background: linear-gradient(135deg, rgba(255,217,102,0.95), rgba(255,138,61,0.95)); color: #1a0f2e; }
  .toast.win { background: linear-gradient(135deg, rgba(126,255,192,0.95), rgba(0,220,140,0.95)); color: #0a1f14; }
  .toast.lose { background: linear-gradient(135deg, rgba(255,61,61,0.95), rgba(180,0,0,0.95)); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
  .modal { background: linear-gradient(180deg, #1f1435, #0a0615); border-radius: 24px; padding: 24px 20px; max-width: 340px; width: 100%; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
  .modal-emoji { font-size: 44px; margin-bottom: 10px; }

  .modal-btn { display: block; width: 100%; margin-top: 10px; padding: 12px; border-radius: 14px; border: none; background: rgba(255,255,255,0.08); color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; }
  .modal-btn.primary { background: linear-gradient(135deg, #7b5cff, #b44cff); }

</head>

  function spawnParticle(x, y, text, color, size = 20) {
    if (particles.length > 30) particles.shift();
    particles.push({ x, y, text, color, size, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 4 - 1, life: 1, decay: 0.022 + Math.random() * 0.02 });
  }

  function updateParticles() {
    if (particles.length === 0) { requestAnimationFrame(updateParticles); return; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.font = `900 ${p.size}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(updateParticles);
  }

    if (n < 1e9) return (n/1e6).toFixed(n < 1e7 ? 1 : 0).replace('.0','') + 'M';

  function buildShop() {
    tabBody.innerHTML = '';
    const wrap = document.createElement('div');
    for (const u of UPGRADES) {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `<div class="item-icon">${u.icon}</div><div class="item-info"><div class="item-name">${u.name}</div><div class="item-desc">${u.desc}</div><div class="item-lvl">Ур. <span class="lvl">0</span></div></div><button class="buy-btn">🍊 0</button>`;
      const btn = el.querySelector('.buy-btn');
      btn.addEventListener('click', (e) => { e.stopPropagation(); buy(u, el); });
      u._el = el; u._btn = btn; u._lvl = el.querySelector('.lvl');
      wrap.appendChild(el);
    }
    tabBody.appendChild(wrap); shopBuilt = true; updateShop();
  }
  function updateShop() {
    if (!shopBuilt) return;
    for (const u of UPGRADES) {
      const cost = getCost(u);
      u._lvl.textContent = state.levels[u.id] || 0;
      const can = state.score >= cost;
      u._btn.textContent = '🍊 ' + fmt(cost);
      u._btn.classList.toggle('disabled', !can);
      u._el.classList.toggle('affordable', can);
    }
  }
  function updateShopThrottled() {
    const now = Date.now();
    if (now - lastShopUpdate > 250) { lastShopUpdate = now; updateShop(); }
  }
  function buy(u, el) {
    const cost = getCost(u);
    if (state.score < cost) return;
    state.score -= cost; state.levels[u.id] = (state.levels[u.id] || 0) + 1; state.upgradesBought++;
    sndBuy(); if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    updateScoreNumber(true); updateShop(); updateHeader(); updateStats();
    updateQuestProgress('buys', 1);
    checkAchievements(); save();
  }

  // ============== SKINS ==============
  function applySkins() {
    const apply = (el, id) => {
      el.className = el.className.replace(/skin-[\w-]+/g, '').trim();
      el.classList.add(id);
    };
    apply(charV, state.activeSkins.v);
    apply(charS, state.activeSkins.s);
    apply(catThai, state.activeSkins.catThai);
    apply(catBrown, state.activeSkins.catBrown);
  }

  function renderSkins() {
    tabBody.innerHTML = '';
    const categories = [
      { key: 'v', label: '👩 Василиса' }, { key: 's', label: '👦 Саша' },
      { key: 'catThai', label: '🐈‍⬛ Тайка' }, { key: 'catBrown', label: '🐈 Тасик' }
    ];
    categories.forEach(cat => {
      const title = document.createElement('div');
      title.style.cssText = 'font-size:14px; font-weight:800; margin: 12px 0 8px; color:#a78bff;';
      title.textContent = cat.label;
      tabBody.appendChild(title);
      const grid = document.createElement('div'); grid.className = 'skin-grid';
      SKINS[cat.key].forEach(skin => {
        const owned = state.ownedSkins.includes(skin.id);
        const active = state.activeSkins[cat.key] === skin.id;
        let btnHtml = owned ? (active ? 'Выбрано' : 'Надеть') : (skin.reqStars ? `⭐ ${skin.reqStars}` : `🍊 ${fmt(skin.price)}`);
        const card = document.createElement('div');
        card.className = 'skin-card' + (owned ? ' owned' : '') + (active ? ' active' : '');
        card.innerHTML = `<div class="skin-title">${skin.name}</div><div class="skin-preview">${skin.icon}</div><button class="skin-btn ${owned ? (active ? 'active' : '') : (skin.reqStars ? 'stars' : 'buy')}">${btnHtml}</button>`;
        const btn = card.querySelector('.skin-btn');
        btn.onclick = () => {
          if (owned) {
            state.activeSkins[cat.key] = skin.id;
            applySkins(); renderSkins(); save();
          } else if (skin.reqStars) {
            if (state.stars >= skin.reqStars) {
              state.ownedSkins.push(skin.id);
              state.activeSkins[cat.key] = skin.id;
              applySkins(); updateScoreNumber(true); sndBuy(); renderSkins();
              updateQuestProgress('skins', 1); save();
            } else {
              showToast('НЕ ХВАТАЕТ ЗВЁЗД', `Нужно ${skin.reqStars} ⭐`, 'ach');
            }
          } else if (state.score >= skin.price) {
            state.score -= skin.price;
            state.ownedSkins.push(skin.id);
            state.activeSkins[cat.key] = skin.id;
            applySkins(); updateScoreNumber(true); sndBuy(); renderSkins();
            updateQuestProgress('skins', 1); save();
          }
        };
        grid.appendChild(card);
      });
      tabBody.appendChild(grid);
    });
  }

  // ============== CASINO ==============
  const WHEEL_SEGMENTS = [
    { mult: 0, weight: 35 }, { mult: 0.5, weight: 25 }, { mult: 1, weight: 20 },
    { mult: 2, weight: 10 }, { mult: 3, weight: 5 }, { mult: 5, weight: 3 },
    { mult: 10, weight: 1.5 }, { mult: 50, weight: 0.5 },
  ];
  const SLOT_SYMBOLS = [
    { sym: '🍊', weight: 30, pay3: 3 }, { sym: '🌟', weight: 25, pay3: 4 },
    { sym: '💎', weight: 20, pay3: 6 }, { sym: '👑', weight: 15, pay3: 10 },
    { sym: '🎰', weight: 10, pay3: 50 },
  ];

  function minesMult(k, total, mines) {
    if (k === 0) return 1;
    let m = 1;
    for (let i = 0; i < k; i++) m *= (total - i) / (total - mines - i);
    return m;
  }

  function renderCasino() {
    tabBody.innerHTML = '';
    const ma = state.minesActive;
    const cellsHtml = ma.cells.map((c, i) => {
      let cls = 'mine-cell';
      let content = '';
      if (c.revealed) {
        cls += c.mine ? ' mine' : ' safe';
        content = c.mine ? '💣' : '💎';
      }
      return `<div class="${cls}" data-idx="${i}">${content}</div>`;
    }).join('');

    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="casino-card">
        <div class="casino-title">🎡 Колесо Фортуны</div>
        <div class="casino-desc">Крути колесо! Выигрыш от 0 до ×50.</div>
        <div class="wheel-wrap"><div class="wheel-pointer">▼</div><div class="wheel" id="wheel"></div></div>
        <div class="bet-row">
          <input type="number" class="bet-input" id="wheelBet" value="${state.casinoBet}" min="10">
          <button class="bet-quick" data-target="wheelBet" data-mult="0.5">½</button>
          <button class="bet-quick" data-target="wheelBet" data-mult="2">×2</button>
          <button class="bet-quick" data-target="wheelBet" data-mult="max">МАКС</button>
        </div>
        <button class="play-btn" id="wheelPlay">🎡 Крутить</button>
        <div class="wheel-result" id="wheelResult"></div>
      </div>

      <div class="casino-card">
        <div class="casino-title">🪙 Орёл или Решка</div>
        <div class="casino-desc">50/50 — удвой ставку или потеряй всё!</div>
        <div class="coin" id="coin">🪙</div>
        <div class="bet-row">
          <input type="number" class="bet-input" id="coinBet" value="${state.casinoBet}" min="10">
          <button class="bet-quick" data-target="coinBet" data-mult="0.5">½</button>
          <button class="bet-quick" data-target="coinBet" data-mult="2">×2</button>
          <button class="bet-quick" data-target="coinBet" data-mult="max">МАКС</button>
        </div>
        <button class="play-btn" id="coinPlay">🪙 Бросить монету</button>
        <div class="coin-result" id="coinResult"></div>
      </div>

      <div class="casino-card">
        <div class="casino-title">🎰 Слоты</div>
        <div class="casino-desc">2 одинаковых = ×1.2, 3 одинаковых = от ×3 до ×50!</div>
        <div class="slots">
          <div class="slot-reel" id="reel1">🍊</div>
          <div class="slot-reel" id="reel2">🍊</div>
          <div class="slot-reel" id="reel3">🍊</div>
        </div>
        <div class="bet-row">
          <input type="number" class="bet-input" id="slotBet" value="${state.casinoBet}" min="10">
          <button class="bet-quick" data-target="slotBet" data-mult="0.5">½</button>
          <button class="bet-quick" data-target="slotBet" data-mult="2">×2</button>
          <button class="bet-quick" data-target="slotBet" data-mult="max">МАКС</button>
        </div>
        <button class="play-btn" id="slotPlay">🎰 Крутить слоты</button>
        <div class="slot-result" id="slotResult"></div>
      </div>

      <div class="casino-card">
        <div class="casino-title">💣 Мины</div>
        <div class="casino-desc">Открывай безопасные клетки — выигрыш растёт. Наткнёшься на мину — потеряешь всё. Забери выигрыш в любой момент!</div>
        <div style="display:flex; gap:6px; margin-bottom:10px;">
          <button class="mine-diff ${ma.mineCount === 3 ? 'active' : ''}" data-mines="3" ${ma.playing ? 'disabled' : ''}>🐣 3 мины</button>
          <button class="mine-diff ${ma.mineCount === 5 ? 'active' : ''}" data-mines="5" ${ma.playing ? 'disabled' : ''}>🔥 5 мин</button>
          <button class="mine-diff ${ma.mineCount === 10 ? 'active' : ''}" data-mines="10" ${ma.playing ? 'disabled' : ''}>💀 10 мин</button>
        </div>
        <div class="mines-grid" id="minesGrid">${cellsHtml || Array(25).fill('<div class="mine-cell"></div>').join('')}</div>
        <div class="mines-info" id="minesInfo">
          <span>Открыто: <b>${ma.safeRevealed}</b> / ${25 - ma.mineCount}</span>
          <span>Множитель: <b>×${minesMult(ma.safeRevealed, 25, ma.mineCount).toFixed(2)}</b></span>
        </div>
        <div class="bet-row">
          <input type="number" class="bet-input" id="minesBet" value="${ma.bet || state.casinoBet}" min="10" ${ma.playing ? 'disabled' : ''}>
          <button class="bet-quick" data-target="minesBet" data-mult="0.5" ${ma.playing ? 'disabled' : ''}>½</button>
          <button class="bet-quick" data-target="minesBet" data-mult="2" ${ma.playing ? 'disabled' : ''}>×2</button>
          <button class="bet-quick" data-target="minesBet" data-mult="max" ${ma.playing ? 'disabled' : ''}>МАКС</button>
        </div>
        <button class="play-btn" id="minesStart" ${ma.playing ? 'style="display:none"' : ''}>💣 Начать игру</button>
        <button class="play-btn" id="minesCashout" ${ma.playing && ma.safeRevealed > 0 ? '' : 'style="display:none"'} style="${ma.playing && ma.safeRevealed > 0 ? 'background:linear-gradient(135deg,#7effc0,#00d488);color:#0a1f14;' : ''}">💰 Забрать ${fmt(Math.floor(ma.bet * minesMult(ma.safeRevealed, 25, ma.mineCount)))} 🍊</button>
        <div class="mines-result" id="minesResult"></div>
      </div>

      <div style="text-align:center; font-size:11px; color:rgba(255,255,255,0.4); padding:10px;">
        🎲 Всего игр: ${state.casinoPlays + state.minesPlays} · Побед: ${state.casinoWins + state.minesWins} · Проигрышей: ${state.casinoLost}
      </div>
    `;
    tabBody.appendChild(wrap);

    wrap.querySelectorAll('.bet-quick').forEach(b => {
      b.onclick = () => {
        const targetId = b.dataset.target;
        const input = document.getElementById(targetId);
        const mult = b.dataset.mult;
        if (mult === 'max') input.value = Math.floor(state.score);
        else input.value = Math.max(10, Math.floor((parseFloat(input.value) || 0) * parseFloat(mult)));
      };
    });

    // WHEEL
    let wheelSpinning = false;
    $('wheelPlay').onclick = () => {
      if (wheelSpinning) return;
      const bet = Math.floor(parseFloat($('wheelBet').value) || 0);
      if (bet < 10) { showToast('МИН. СТАВКА', '10 мандаринок', 'lose'); return; }
      if (state.score < bet) { showToast('НЕ ХВАТАЕТ', 'У тебя нет столько!', 'lose'); return; }
      wheelSpinning = true;
      state.score -= bet; state.casinoPlays++; updateScoreNumber(false);
      sndSpin();
      const totalWeight = WHEEL_SEGMENTS.reduce((a, s) => a + s.weight, 0);
      let r = Math.random() * totalWeight, chosen = WHEEL_SEGMENTS[0], chosenIndex = 0;
      for (let i = 0; i < WHEEL_SEGMENTS.length; i++) { r -= WHEEL_SEGMENTS[i].weight; if (r <= 0) { chosen = WHEEL_SEGMENTS[i]; chosenIndex = i; break; } }
      const segmentAngle = 360 / WHEEL_SEGMENTS.length;
      const spins = 5 + Math.floor(Math.random() * 3);
      const targetAngle = spins * 360 + (360 - chosenIndex * segmentAngle - segmentAngle/2);
      const wheelEl = $('wheel');
      wheelEl.style.transition = 'transform 3.5s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
      wheelEl.style.transform = `rotate(${targetAngle}deg)`;
      setTimeout(() => {
        const win = Math.floor(bet * chosen.mult);
        $('wheelResult').textContent = `×${chosen.mult} → ${win > 0 ? '+' + fmt(win) : '0'}`;
        $('wheelResult').style.color = chosen.mult >= 1 ? '#7effc0' : '#ff3d3d';
        if (chosen.mult >= 1) { state.casinoWins++; } else { state.casinoLost++; }
        state.score += win; state.totalEarned += win;
        if (win > 0) {
          sndWin(); showToast('🎡 ВЫИГРЫШ!', `×${chosen.mult} → +${fmt(win)}`, 'win');
          if (chosen.mult >= 10) startMania(5);
        } else { sndLose(); showToast('🎡 МИМО', 'Повезёт в следующий раз', 'lose'); }
        updateScoreNumber(true); checkStage(); updateHeader();
        updateQuestProgress('casino', 1);
        if (chosen.mult >= 1) updateQuestProgress('casinoWin', 1);
        checkAchievements(); save();
        wheelSpinning = false;
        refreshCasinoStats();
      }, 3600);
    };

    // COIN
    let coinFlipping = false;
    $('coinPlay').onclick = () => {
      if (coinFlipping) return;
      const bet = Math.floor(parseFloat($('coinBet').value) || 0);
      if (bet < 10) { showToast('МИН. СТАВКА', '10 мандаринок', 'lose'); return; }
      if (state.score < bet) { showToast('НЕ ХВАТАЕТ', 'У тебя нет столько!', 'lose'); return; }
      coinFlipping = true;
      state.score -= bet; state.casinoPlays++; updateScoreNumber(false);
      sndSpin();
      const coinEl = $('coin');
      coinEl.textContent = '🪙'; // reset from previous state
      coinEl.classList.remove('flipping');
      void coinEl.offsetWidth;
      coinEl.classList.add('flipping');
      setTimeout(() => {
        const isWin = Math.random() < 0.5;
        const result = isWin ? bet * 2 : 0;
        state.score += result; state.totalEarned += result;
        if (isWin) {
          state.casinoWins++;
          coinEl.textContent = '🪙';
          $('coinResult').textContent = `+${fmt(result)} 🍊`;
          $('coinResult').style.color = '#7effc0';
          sndWin(); showToast('🪙 ПОБЕДА!', `Удвоение: +${fmt(result)}`, 'win');
        } else {
          state.casinoLost++;
          coinEl.textContent = '💩';
          $('coinResult').textContent = `-${fmt(bet)} 🍊`;
          $('coinResult').style.color = '#ff3d3d';
          sndLose(); showToast('🪙 ПРОИГРЫШ', `-${fmt(bet)} мандаринок`, 'lose');
        }
        updateScoreNumber(true); checkStage(); updateHeader();
        updateQuestProgress('casino', 1);
        if (isWin) updateQuestProgress('casinoWin', 1);
        checkAchievements(); save();
        coinFlipping = false;
        refreshCasinoStats();
      }, 1600);
    };

    // SLOTS
    let slotSpinning = false;
    $('slotPlay').onclick = () => {
      if (slotSpinning) return;
      const bet = Math.floor(parseFloat($('slotBet').value) || 0);
      if (bet < 10) { showToast('МИН. СТАВКА', '10 мандаринок', 'lose'); return; }
      if (state.score < bet) { showToast('НЕ ХВАТАЕТ', 'У тебя нет столько!', 'lose'); return; }
      slotSpinning = true;
      state.score -= bet; state.casinoPlays++; updateScoreNumber(false);
      sndSpin();
      const reels = [$('reel1'), $('reel2'), $('reel3')];
      reels.forEach(r => r.classList.add('spinning'));
      const intervals = [];
      reels.forEach((reel, i) => {
        intervals[i] = setInterval(() => {
          reel.textContent = SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)].sym;
        }, 80);
      });
      const pickSym = () => {
        const total = SLOT_SYMBOLS.reduce((a, s) => a + s.weight, 0);
        let r = Math.random() * total;
        for (const s of SLOT_SYMBOLS) { r -= s.weight; if (r <= 0) return s; }
        return SLOT_SYMBOLS[0];
      };
      const finals = [];
      [800, 1300, 1800].forEach((t, i) => {
        setTimeout(() => {
          clearInterval(intervals[i]);
          finals[i] = pickSym();
          reels[i].textContent = finals[i].sym;
          reels[i].classList.remove('spinning');
          if (i === 2) {
            const syms = finals.map(f => f.sym);
            let winMult = 0, winType = '';
            if (syms[0] === syms[1] && syms[1] === syms[2]) {
              const matched = SLOT_SYMBOLS.find(s => s.sym === syms[0]);
              winMult = matched.pay3; winType = `3× ${syms[0]}`;
            } else if (syms[0] === syms[1] || syms[1] === syms[2] || syms[0] === syms[2]) {
              winMult = 1.2; winType = '2 одинаковых';
            }
            const win = Math.floor(bet * winMult);
            state.score += win; state.totalEarned += win;
            if (winMult >= 1) {
              state.casinoWins++;
              $('slotResult').textContent = `🎉 ${winType} — +${fmt(win)} 🍊`;
              $('slotResult').style.color = '#7effc0';
              sndWin(); showToast('🎰 ВЫИГРЫШ!', `${winType}: +${fmt(win)}`, 'win');
              if (winMult >= 10) startMania(10);
            } else {
              state.casinoLost++;
              $('slotResult').textContent = `😢 Мимо — -${fmt(bet)} 🍊`;
              $('slotResult').style.color = '#ff3d3d';
              sndLose(); showToast('🎰 МИМО', `-${fmt(bet)} мандаринок`, 'lose');
            }
            updateScoreNumber(true); checkStage(); updateHeader();
            updateQuestProgress('casino', 1);
            if (winMult >= 1) updateQuestProgress('casinoWin', 1);
            checkAchievements(); save();
            slotSpinning = false;
            refreshCasinoStats();
          }
        }, t);
      });
    };

    // MINES
    wrap.querySelectorAll('.mine-diff').forEach(b => {
      b.onclick = () => {
        if (state.minesActive.playing) return;
        state.minesActive.mineCount = parseInt(b.dataset.mines);
        save(); renderCasino();
      };
    });

    wrap.querySelectorAll('.mine-cell').forEach((cell, idx) => {
      cell.onclick = () => revealMine(idx);
    });

    $('minesStart').onclick = () => startMines();

    const cashoutBtn = $('minesCashout');
    if (cashoutBtn) cashoutBtn.onclick = () => cashoutMines();
  }

  function refreshCasinoStats() {
    if (currentTab !== 'casino') return;
    const stats = tabBody.querySelector('div[style*="Всего игр"]');
    if (stats) stats.innerHTML = `🎲 Всего игр: ${state.casinoPlays + state.minesPlays} · Побед: ${state.casinoWins + state.minesWins} · Проигрышей: ${state.casinoLost}`;
  }

  function startMines() {
    const ma = state.minesActive;
    if (ma.playing) return;
    const bet = Math.floor(parseFloat($('minesBet').value) || 0);
    if (bet < 10) { showToast('МИН. СТАВКА', '10 мандаринок', 'lose'); return; }
    if (state.score < bet) { showToast('НЕ ХВАТАЕТ', 'У тебя нет столько!', 'lose'); return; }

    state.score -= bet;
    state.casinoBet = bet;
    state.minesPlays++;

    ma.playing = true;
    ma.bet = bet;
    ma.safeRevealed = 0;
    ma.cells = [];
    for (let i = 0; i < 25; i++) ma.cells.push({ mine: false, revealed: false });
    const minePos = new Set();
    while (minePos.size < ma.mineCount) {
      minePos.add(Math.floor(Math.random() * 25));
    }
    minePos.forEach(i => ma.cells[i].mine = true);

    // re-render grid
    const grid = $('minesGrid');
    if (grid) {
      grid.innerHTML = ma.cells.map((c, i) => `<div class="mine-cell" data-idx="${i}"></div>`).join('');
      grid.querySelectorAll('.mine-cell').forEach((cell, idx) => {
        cell.onclick = () => revealMine(idx);
      });
    }
    $('minesStart').style.display = 'none';
    $('minesCashout').style.display = 'none';
    $('minesInfo').innerHTML = `<span>Открыто: <b>0</b> / ${25 - ma.mineCount}</span><span>Множитель: <b>×1.00</b></span>`;
    $('minesResult').textContent = '';
    $('minesBet').disabled = true;
    document.querySelectorAll('[data-target="minesBet"]').forEach(b => b.disabled = true);
    updateScoreNumber(false);
    save();
  }

  function revealMine(idx) {
    const ma = state.minesActive;
    if (!ma.playing) return;
    const cell = ma.cells[idx];
    if (!cell || cell.revealed) return;

    const grid = $('minesGrid');
    const cellEl = grid.children[idx];

    cell.revealed = true;

    if (cell.mine) {
      // LOSE
      cellEl.textContent = '💣';
      cellEl.classList.add('mine');
      state.casinoLost++;
      state.minesActive.playing = false;
      // Reveal all remaining mines
      ma.cells.forEach((c, i) => {
        if (!c.revealed && c.mine) {
          const e = grid.children[i];
          if (e) { e.textContent = '💣'; e.classList.add('mine'); }
        }
      });
      sndMines(); sndLose();
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      $('minesResult').textContent = `💥 БУМ! Потерял ${fmt(ma.bet)} 🍊`;
      $('minesResult').style.color = '#ff3d3d';
      showToast('💥 БУМ!', `-${fmt(ma.bet)} мандаринок`, 'lose');
      finishMinesUI();
      checkAchievements(); save();
    } else {
      // SAFE
      cellEl.textContent = '💎';
      cellEl.classList.add('safe');
      ma.safeRevealed++;
      const mult = minesMult(ma.safeRevealed, 25, ma.mineCount);
      const currentWin = Math.floor(ma.bet * mult);
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      beep(600 + ma.safeRevealed * 40, 0.06, 0.04);
      $('minesInfo').innerHTML = `<span>Открыто: <b>${ma.safeRevealed}</b> / ${25 - ma.mineCount}</span><span>Множитель: <b>×${mult.toFixed(2)}</b></span>`;
      const cashoutBtn = $('minesCashout');
      if (cashoutBtn) {
        cashoutBtn.style.display = 'block';
        cashoutBtn.style.background = 'linear-gradient(135deg,#7effc0,#00d488)';
        cashoutBtn.style.color = '#0a1f14';
        cashoutBtn.textContent = `💰 Забрать ${fmt(currentWin)} 🍊`;
      }
      // Win if all safe cells revealed
      if (ma.safeRevealed === 25 - ma.mineCount) {
        cashoutMines();
      }
      save();
    }
  }

  function cashoutMines() {
    const ma = state.minesActive;
    if (!ma.playing || ma.safeRevealed === 0) return;
    const mult = minesMult(ma.safeRevealed, 25, ma.mineCount);
    const win = Math.floor(ma.bet * mult);
    state.score += win;
    state.totalEarned += win;
    state.minesWins++;
    if (mult >= 10) state.minesBigWin++;
    ma.playing = false;

    sndWin();
    showToast('💰 ЗАБРАЛ!', `${ma.safeRevealed} клеток · ×${mult.toFixed(2)} → +${fmt(win)}`, 'win');
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    $('minesResult').textContent = `💰 +${fmt(win)} 🍊`;
    $('minesResult').style.color = '#7effc0';

    // Reveal all mines
    const grid = $('minesGrid');
    ma.cells.forEach((c, i) => {
      if (!c.revealed && c.mine) {
        const e = grid.children[i];
        if (e) { e.textContent = '💣'; e.classList.add('mine'); }
      }
    });

    updateScoreNumber(true); checkStage(); updateHeader();
    updateQuestProgress('mines', 1);
    updateQuestProgress('minesWin', 1);
    checkAchievements(); save();
    finishMinesUI();
  }

  function finishMinesUI() {
    const ma = state.minesActive;
    const grid = $('minesGrid');
    if (grid) {
      grid.querySelectorAll('.mine-cell').forEach(c => c.onclick = null);
    }
    const startBtn = $('minesStart');
    if (startBtn) startBtn.style.display = 'block';
    const cashoutBtn = $('minesCashout');
    if (cashoutBtn) cashoutBtn.style.display = 'none';
    const betInput = $('minesBet');
    if (betInput) betInput.disabled = false;
    document.querySelectorAll('[data-target="minesBet"]').forEach(b => b.disabled = false);
    refreshCasinoStats();
  }

  // ============== STREAK ==============
  function getTodayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }
  function getYesterdayKey() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }
  function renderStreak() {
    tabBody.innerHTML = '';
    const today = getTodayKey();
    const lastClaim = state.streak.lastClaimDate || '';
    const canClaim = lastClaim !== today;
    let current = state.streak.current || 0;
    if (lastClaim && lastClaim !== today && lastClaim !== getYesterdayKey()) current = 0;
    const dayInCycle = current % 7;
    const baseReward = Math.max(1000, getBaseTapValue() * 100);

    const container = document.createElement('div');
    let daysHtml = '';
    for (let i = 0; i < 7; i++) {
      let cls = 'streak-day';
      if (i < dayInCycle) cls += ' claimed';
      else if (i === dayInCycle && canClaim) cls += ' today';
      const r = STREAK_REWARDS[i];
      daysHtml += `<div class="${cls}">${r.icon}<br>${r.label}</div>`;
    }
    container.innerHTML = `
      <div class="streak-wrap">
        <div class="streak-title">🎁 Ежедневный стрик</div>
        <div class="streak-bar">${daysHtml}</div>
        <div style="text-align:center;font-size:12px;color:rgba(255,255,255,0.6);margin:8px 0;">
          Текущий: <b style="color:#ffd966">${current} дней</b> · Рекорд: ${state.streak.best || 0}
        </div>
        <button class="streak-claim" id="streakBtn" ${canClaim ? '' : 'disabled'}>
          ${canClaim ? `Забрать награду дня ${dayInCycle + 1}` : 'Приходи завтра!'}
        </button>
      </div>
      <div style="font-size:11px;color:rgba(255,255,255,0.4);text-align:center;padding:10px;line-height:1.6;">
        Заходи каждый день — получай награды!<br>День 7 = джекпот 🎉<br>Пропустишь — стрик сбросится 😢
      </div>
    `;
    tabBody.appendChild(container);

    if (canClaim) {
      $('streakBtn').onclick = () => {
        current++;
        if (current > (state.streak.best || 0)) state.streak.best = current;
        state.streak.current = current;
        state.streak.lastClaimDate = today;
        const r = STREAK_REWARDS[(current - 1) % 7];
        if (r.icon === '⭐') {
          state.stars += (r.label === '2⭐' ? 2 : 1);
          showToast('🎁 СТРИК!', `+${r.label}`, 'ach');
        } else if ((current - 1) % 7 === 6) {
          const jackpot = baseReward * 500;
          state.score += jackpot; state.totalEarned += jackpot;
          state.stars += 1;
          showToast('🎁 ДЖЕКПОТ!', `+${fmt(jackpot)} 🍊 + 1 ⭐`, 'gold');
          spawnParticle(window.innerWidth/2, window.innerHeight/2, 'ДЖЕКПОТ!', '#ffd966', 36);
        } else {
          const rewardAmount = baseReward * r.mult;
          state.score += rewardAmount; state.totalEarned += rewardAmount;
          showToast('🎁 СТРИК!', `+${fmt(rewardAmount)} 🍊`, 'ach');
        }
        sndWin();
        updateScoreNumber(true); checkStage(); updateHeader(); updateStats();
        checkAchievements(); save(); renderStreak();
      };
    }
  }

  // ============== QUESTS ==============
  function getWeekKey() {
    const d = new Date();
    const start = new Date(d.getFullYear(), 0, 1);
    const days = Math.floor((d - start) / 86400000);
    return `${d.getFullYear()}-W${Math.floor(days / 7)}`;
  }
  function generateDailyQuests() {
    const shuffled = [...QUEST_POOL].sort(() => Math.random() - 0.5);
    const baseReward = Math.max(500, Math.floor(getBaseTapValue() * 100));
    state.daily = { date: getTodayKey(), quests: shuffled.slice(0, 6).map(q => ({ ...q, current: 0, done: false, reward: Math.floor(baseReward * q.rewardMult) })) };
    save();
  }
  function generateWeeklyQuests() {
    const baseReward = Math.max(5000, Math.floor(getBaseTapValue() * 500));
    state.weekly = { week: getWeekKey(), quests: WEEKLY_QUESTS.map(q => ({ ...q, current: 0, done: false, reward: Math.floor(baseReward * q.rewardMult) })) };
    save();
  }
  function checkDailyQuests() {
    if (!state.daily.date || state.daily.date !== getTodayKey()) generateDailyQuests();
    if (!state.weekly.week || state.weekly.week !== getWeekKey()) generateWeeklyQuests();
  }
  function updateQuestProgress(type, amount, isCombo = false) {
    let changed = false;
    state.daily.quests.forEach(q => {
      if (q.type === type && !q.done) {
        if (isCombo) q.current = Math.max(q.current, amount);
        else q.current += amount;
        if (q.current >= q.target) { q.current = q.target; q.done = true; showToast('ЗАДАНИЕ ВЫПОЛНЕНО!', q.name, 'ach'); }
        changed = true;
      }
    });
    state.weekly.quests.forEach(q => {
      if (q.type === type && !q.done) {
        if (isCombo) q.current = Math.max(q.current, amount);
        else q.current += amount;
        if (q.current >= q.target) { q.current = q.target; q.done = true; showToast('НЕДЕЛЬНОЕ ВЫПОЛНЕНО!', q.name, 'ach'); }
        changed = true;
      }
    });
    if (changed) { save(); if (currentTab === 'quests') renderQuests(); }
  }
  function renderQuests() {
    tabBody.innerHTML = '';
    const dailyTitle = document.createElement('div');
    dailyTitle.style.cssText = 'font-size:14px; font-weight:800; margin: 4px 0 8px; color:#ffd966;';
    dailyTitle.textContent = '📅 Ежедневные';
    tabBody.appendChild(dailyTitle);
    state.daily.quests.forEach(q => {
      const el = document.createElement('div');
      el.className = 'quest' + (q.done && q.claimed ? ' done' : '');
      const pct = Math.min(100, (q.current / q.target) * 100);
      el.innerHTML = `<div class="quest-icon">${q.icon}</div><div class="quest-info"><div class="quest-name">${q.name}</div><div class="quest-bar"><div class="quest-fill" style="width: ${pct}%"></div></div><div class="quest-reward">${q.current} / ${q.target} · 🍊 ${fmt(q.reward)}</div></div>${q.done && !q.claimed ? '<button class="quest-claim">Забрать</button>' : (q.claimed ? '<span style="font-size:16px;">✅</span>' : '')}`;
      tabBody.appendChild(el);
      if (q.done && !q.claimed) {
        el.querySelector('.quest-claim').onclick = () => {
          state.score += q.reward; state.totalEarned += q.reward; q.claimed = true;
          updateScoreNumber(true); sndBuy(); updateHeader(); checkStage(); save(); renderQuests();
        };
      }
    });
    const weeklyTitle = document.createElement('div');
    weeklyTitle.style.cssText = 'font-size:14px; font-weight:800; margin: 16px 0 8px; color:#ff8ac4;';
    weeklyTitle.textContent = '📆 Недельные';
    tabBody.appendChild(weeklyTitle);
    state.weekly.quests.forEach(q => {
      const el = document.createElement('div');
      el.className = 'quest' + (q.done && q.claimed ? ' done' : '');
      const pct = Math.min(100, (q.current / q.target) * 100);
      el.innerHTML = `<div class="quest-icon">${q.icon}</div><div class="quest-info"><div class="quest-name">${q.name}</div><div class="quest-bar"><div class="quest-fill" style="width: ${pct}%; background: linear-gradient(90deg, #ff8ac4, #b44cff);"></div></div><div class="quest-reward">${q.current} / ${q.target} · 🍊 ${fmt(q.reward)}</div></div>${q.done && !q.claimed ? '<button class="quest-claim">Забрать</button>' : (q.claimed ? '<span style="font-size:16px;">✅</span>' : '')}`;
      tabBody.appendChild(el);
      if (q.done && !q.claimed) {
        el.querySelector('.quest-claim').onclick = () => {
          state.score += q.reward; state.totalEarned += q.reward; q.claimed = true;
          updateScoreNumber(true); sndBuy(); updateHeader(); checkStage(); save(); renderQuests();
        };
      }
    });
  }

  // ============== REBIRTH ==============
  function getNextRebirthStars() { return state.totalEarned < 100000 ? 0 : Math.floor(Math.sqrt(state.totalEarned / 100000)); }
  function renderRebirth() {
    tabBody.innerHTML = '';
    const potentialStars = getNextRebirthStars();
    const reqForNext = Math.pow(potentialStars + 1, 2) * 100000;
    let progPct = 0;
    if (potentialStars > 0) {
      const currentReq = Math.pow(potentialStars, 2) * 100000;
      progPct = Math.min(100, ((state.totalEarned - currentReq) / (reqForNext - currentReq)) * 100);
    } else progPct = Math.min(100, (state.totalEarned / 100000) * 100);

    const container = document.createElement('div');
    container.innerHTML = `
      <div class="rebirth-hero">
        <div class="rebirth-stars">${state.stars}</div>
        <div class="rebirth-label">Звёзд всего</div>
        <div class="rebirth-mult">Множитель: x${getRebirthMultiplier().toFixed(2)}</div>
      </div>
      <div class="rebirth-stats">
        <div class="rebirth-stat"><div class="rebirth-stat-val">${state.rebirths}</div><div class="rebirth-stat-lbl">Перерождений</div></div>
        <div class="rebirth-stat"><div class="rebirth-stat-val">+${potentialStars}</div><div class="rebirth-stat-lbl">Доступно</div></div>
      </div>
      <div class="rebirth-progress" style="margin-top:12px;">
        <div class="rebirth-progress-line"><span>Прогресс</span><span>${fmt(state.totalEarned)} / ${fmt(reqForNext)}</span></div>
        <div class="rebirth-bar"><div class="rebirth-bar-fill" style="width: ${progPct}%"></div></div>
      </div>
      <button class="rebirth-btn ${potentialStars > 0 ? '' : 'disabled'}" id="doRebirthBtn">${potentialStars > 0 ? '🌟 Переродиться' : 'Нужно 100K'}</button>
      <div class="rebirth-info">Сбрасывает мандаринки и улучшения, но даёт <b>Звёзды</b>.<br>Каждая звезда = <b>+25%</b> к доходу. Скины и достижения сохраняются!</div>
    `;
    tabBody.appendChild(container);

    if (potentialStars > 0) {
      $('doRebirthBtn').onclick = () => {
        showModal(`
          <div class="modal-emoji">🌌</div>
          <div class="modal-title">Новая жизнь</div>
          <div class="modal-text">Ты получишь звёзды, но сбросишь прогресс и улучшения.</div>
          <div class="modal-big">+${potentialStars} ⭐</div>
        `, [
          { text: 'Отмена' },
          { text: 'Переродиться!', primary: true, action: () => {
            state.stars += potentialStars; state.rebirths++;
            state.score = 0; state.totalEarned = 0; state.stage = 0; state.levels = {}; state.taps = 0;
            state.combo = 0; state.doubleChickens = 0;
            updateDuo(); updateScoreNumber(true); updateStats(); checkStage(); updateHeader(); switchTab('rebirth'); sndRebirth();
            showToast('ПЕРЕРОЖДЕНИЕ', 'Новая жизнь началась!', 'ach'); save();
          }}
        ]);
      };
    }
  }

  // ============== STORY & ACH ==============
  function renderStory() {
    tabBody.innerHTML = '';
    STORY.forEach((s, i) => {
      const unlocked = state.totalEarned >= STAGES[i].need;
      const el = document.createElement('div');
      el.className = 'story-item' + (unlocked ? '' : ' locked');
      el.innerHTML = `<div class="story-title"><span class="dot"></span>${s.title}</div><div class="story-text">${unlocked ? s.text : '🔒 Откроется на этапе «' + STAGES[i].name + '»'}</div>`;
      tabBody.appendChild(el);
    });
  }

  function checkAchievements() {
    for (const a of ACHIEVEMENTS) {
      if (!state.achievements[a.id] && a.check(state)) {
        state.achievements[a.id] = true;
        showToast('🏆 ДОСТИЖЕНИЕ', a.icon + ' ' + a.name, 'ach'); sndAch();
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      }
    }
  }

  // ============== TABS ==============
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    tabBody.scrollTop = 0; shopBuilt = false;
    if (tab === 'shop') buildShop();
    else if (tab === 'story') renderStory();
    else if (tab === 'rebirth') renderRebirth();
    else if (tab === 'skins') renderSkins();
    else if (tab === 'quests') renderQuests();
    else if (tab === 'casino') renderCasino();
    else if (tab === 'streak') renderStreak();
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

  function updateSoundBtn() { soundBtn.textContent = state.soundMuted ? '🔇' : '🔊'; }
  soundBtn.addEventListener('click', () => { initAudio(); state.soundMuted = !state.soundMuted; updateSoundBtn(); save(); });
  musicBtn.addEventListener('click', toggleMusic);

  function showModal(html, buttons) {
    const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
    const modal = document.createElement('div'); modal.className = 'modal'; modal.innerHTML = html;
    overlay.appendChild(modal); document.body.appendChild(overlay);
    buttons.forEach(btn => {
      const b = document.createElement('button');
      b.className = 'modal-btn' + (btn.primary ? ' primary' : '');
      b.textContent = btn.text;
      b.onclick = () => { overlay.remove(); if (btn.action) btn.action(); };
      modal.appendChild(b);
    });
  }

  function checkOffline() {
    if (!state.lastSeen) return;
    const elapsedSec = Math.min((Date.now() - state.lastSeen) / 1000, 8 * 3600);
    const passive = getPassive();
    if (passive > 0 && elapsedSec > 60) {
      const earned = Math.floor(passive * elapsedSec);
      if (earned < 10) return;
      state.score += earned; state.totalEarned += earned;
      const h = Math.floor(elapsedSec / 3600), m = Math.floor((elapsedSec % 3600) / 60);
      const timeStr = h > 0 ? `${h} ч ${m} мин` : `${m} мин`;
      showModal(`
        <div class="modal-emoji">🌙</div>
        <div class="modal-title">Пока тебя не было</div>
        <div class="modal-text">Василиса и коты работали<br>за ${timeStr}</div>
        <div class="modal-big">+${fmt(earned)} 🍊</div>
      `, [{ text:'Забрать!', primary:true }]);
      sndStage(); updateScoreNumber(true); updateStats(); checkStage(); updateHeader();
      if (currentTab === 'shop') updateShop();
    }
  }

  // ============== GOLDEN ==============
  function spawnGolden() {
    if (document.hidden) return;
    const r = tapZone.getBoundingClientRect();
    const g = document.createElement('div');
    g.className = 'golden'; g.textContent = '🍊';
    g.style.left = (60 + Math.random() * (r.width - 120)) + 'px';
    g.style.top = (50 + Math.random() * (r.height - 100)) + 'px';
    g.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation(); g.remove();
      const bonus = Math.max(150, getBaseTapValue() * 30, getPassive() * 15);
      state.score += bonus; state.totalEarned += bonus; state.goldenCaught++;
      startMania(10);
      showToast('ЗОЛОТАЯ МАНДАРИНКА!', `+${fmt(bonus)} · 🔥 x3 на 10 сек`, 'gold');
      spawnParticle(e.clientX, e.clientY, '+' + fmt(bonus), '#ffd966', 30); sndGolden();
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      updateScoreNumber(true); checkStage(); updateHeader(); updateStats();
      if (currentTab === 'shop') updateShopThrottled();
      updateQuestProgress('goldens', 1);
      checkAchievements();
    }, { passive: false });
    tapZone.appendChild(g); sndGolden();
    setTimeout(() => { if (g.parentNode) g.remove(); }, 4200);
  }
  function scheduleGolden() { setTimeout(() => { spawnGolden(); scheduleGolden(); }, 20000 + Math.random() * 15000); }

  // ============== AUTO CLICKER (fixed) ==============
  let autoClickAcc = 0;
  let lastTick = Date.now();

  function processAutoClicker() {
    const now = Date.now();
    const dt = (now - lastTick) / 1000;
    lastTick = now;
    const autoLvl = state.levels['auto_clicker'] || 0;
    if (autoLvl > 0) {
      autoClickAcc += dt * autoLvl;
      if (autoClickAcc >= 1) {
        const tapsToDo = Math.floor(autoClickAcc);
        autoClickAcc -= tapsToDo;
        // FIXED: use base tap value (no combo bonus for auto)
        const gain = getBaseTapValue() * tapsToDo;
        state.score += gain;
        state.totalEarned += gain;
        const r = tapBtn.getBoundingClientRect();
        spawnParticle(r.left + r.width/2, r.top + r.height/2, '+' + fmt(gain), '#a78bff', 18);
        checkStage();
        if (currentTab === 'shop') updateShopThrottled();
      }
    } else {
      autoClickAcc = 0;
    }
  }

  function decayCombo() {
    if (state.combo > 0 && Date.now() - state.lastTapTime > 2000) {
      state.combo = 0;
    }
  }

  // ============== INIT & LOOP ==============
  tapBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); initAudio(); doTap(e.clientX, e.clientY); }, { passive: false });
  skillThai.addEventListener('click', (e) => { e.stopPropagation(); useThaiSkill(); });
  skillBrown.addEventListener('click', (e) => { e.stopPropagation(); useBrownSkill(); });

  setInterval(() => {
    const p = getPassive();
    if (p > 0) {
      state.score += p; state.totalEarned += p;
      checkStage();
    }
    updateScoreNumber(false);
    updateStats();
    updateHeader();
    updateManiaUI();
    updateSkillsUI();
    processAutoClicker();
    decayCombo();
    checkAchievements();
    if (currentTab === 'shop') updateShopThrottled();
  }, 1000);

  setInterval(save, 4000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);

  // START
  updateSoundBtn();
  if (state.musicMuted) musicBtn.textContent = '🎵❌';
  else { musicBtn.textContent = '🎵'; initAudio(); if(!musicInterval) musicInterval = setInterval(playMusicNote, 2000); }

  checkDailyQuests();
  updateDuo(); updateHeader(); updateScoreNumber(false); updateStats(); switchTab('shop'); checkAchievements(); checkOffline(); scheduleGolden();
})();
</script>
</body>
</html>
