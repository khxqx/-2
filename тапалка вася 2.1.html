<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Василиса: Путь к успеху</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: #0a0615;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 520px;
    margin: 0 auto;
    position: relative;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, #3a1f6b 0%, transparent 60%),
      radial-gradient(ellipse 70% 40% at 80% 100%, #6b1f5a 0%, transparent 60%),
      radial-gradient(ellipse 70% 40% at 20% 80%, #1f3a6b 0%, transparent 60%),
      linear-gradient(180deg, #150e2a 0%, #0a0615 100%);
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---------- HEADER ---------- */
  .header {
    padding: 12px 18px 6px;
    text-align: center;
    position: relative;
    z-index: 2;
  }
  .stage-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
    background: linear-gradient(90deg, #ffd966, #ff8ac4, #a78bff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px rgba(255,138,196,0.4));
    transition: opacity 0.3s;
  }
  .progress {
    height: 6px;
    border-radius: 6px;
    background: rgba(255,255,255,0.08);
    margin-top: 8px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 6px;
    background: linear-gradient(90deg, #ff8ac4, #ffd966);
    box-shadow: 0 0 12px rgba(255,138,196,0.7);
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ---------- SCORE ---------- */
  .score-area {
    text-align: center;
    padding: 6px 18px 0;
    z-index: 2;
  }
  .score-value {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff, #ffd9ec);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 20px rgba(255,138,196,0.35));
    transition: transform 0.08s;
  }
  .score-value.bump { transform: scale(1.06); }
  .score-label {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .per-sec {
    display: inline-block;
    margin-top: 6px;
    padding: 3px 12px;
    font-size: 12px;
    font-weight: 700;
    color: #7effc0;
    background: rgba(126,255,192,0.1);
    border: 1px solid rgba(126,255,192,0.25);
    border-radius: 20px;
  }

  /* ---------- TAP ZONE ---------- */
  .tap-zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 170px;
    padding: 8px;
    z-index: 1;
  }
  .tap-btn {
    position: relative;
    width: min(60vw, 260px);
    height: min(60vw, 260px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0.03) 55%, transparent 70%),
                linear-gradient(145deg, #4a2a80, #241242);
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow:
      0 0 0 8px rgba(167,139,255,0.06),
      0 0 60px rgba(167,139,255,0.35),
      inset 0 0 40px rgba(255,255,255,0.06),
      0 20px 50px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.08s cubic-bezier(0.3, 1.6, 0.5, 1);
    overflow: hidden;
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 8px rgba(167,139,255,0.06), 0 0 60px rgba(167,139,255,0.35), inset 0 0 40px rgba(255,255,255,0.06), 0 20px 50px rgba(0,0,0,0.5); }
    50% { box-shadow: 0 0 0 14px rgba(167,139,255,0.03), 0 0 90px rgba(255,138,196,0.5), inset 0 0 60px rgba(255,255,255,0.09), 0 20px 50px rgba(0,0,0,0.5); }
  }
  .tap-btn:active { transform: scale(0.94); }
  .tap-btn.pulse::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid rgba(255,217,102,0.7);
    animation: pulseRing 0.55s ease-out forwards;
    pointer-events: none;
  }
  @keyframes pulseRing {
    0% { transform: scale(0.9); opacity: 1; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .chars {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 0;
    width: 100%;
    height: 100%;
    padding-bottom: 4px;
    transition: transform 0.3s;
  }
  .char {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .char svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.5)); }
  .char-v { width: 68%; height: 92%; }
  .char-s {
    width: 0;
    height: 80%;
    opacity: 0;
    transform: scale(0.6) translateY(10px);
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .duo .char-v { width: 52%; height: 90%; }
  .duo .char-s { width: 46%; opacity: 1; transform: scale(1) translateY(0); }

  /* ---------- PANEL ---------- */
  .panel {
    position: relative;
    z-index: 3;
    background: linear-gradient(180deg, rgba(20,13,40,0.85), rgba(10,6,21,0.98));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px 24px 0 0;
    display: flex;
    flex-direction: column;
    max-height: 44vh;
    min-height: 220px;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  }
  .tabs {
    display: flex;
    gap: 6px;
    padding: 12px 16px 8px;
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 9px 10px;
    border: none;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.2px;
  }
  .tab.active {
    background: linear-gradient(135deg, #7b5cff, #b44cff);
    color: #fff;
    box-shadow: 0 4px 18px rgba(123,92,255,0.5);
  }
  .tab-body {
    flex: 1;
    overflow-y: auto;
    padding: 4px 12px 20px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.15) transparent;
  }
  .tab-body::-webkit-scrollbar { width: 4px; }
  .tab-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  /* ---------- SHOP ---------- */
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 14px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.05);
    margin-bottom: 8px;
    transition: all 0.2s;
  }
  .item.affordable {
    background: rgba(126,255,192,0.06);
    border-color: rgba(126,255,192,0.2);
  }
  .item-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name {
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-desc {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    margin-top: 2px;
  }
  .item-lvl {
    font-size: 10.5px;
    color: #a78bff;
    font-weight: 700;
    margin-top: 3px;
  }
  .buy-btn {
    flex-shrink: 0;
    padding: 9px 12px;
    border-radius: 11px;
    border: none;
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    color: #1a0f2e;
    background: linear-gradient(135deg, #ffd966, #ffb347);
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(255,179,71,0.35);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .buy-btn:active { transform: scale(0.93); }
  .buy-btn.disabled {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.35);
    box-shadow: none;
    cursor: default;
  }
  .buy-btn.maxed {
    background: linear-gradient(135deg, #7b5cff, #b44cff);
    color: #fff;
  }

  /* ---------- STORY ---------- */
  .story-item {
    padding: 12px 14px;
    border-radius: 14px;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.04);
    border-left: 3px solid rgba(167,139,255,0.5);
    transition: all 0.3s;
  }
  .story-item.locked {
    opacity: 0.28;
    filter: blur(2.5px);
    border-left-color: rgba(255,255,255,0.15);
  }
  .story-title {
    font-size: 13px;
    font-weight: 800;
    color: #ffd966;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .story-title .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #ffd966;
    box-shadow: 0 0 8px #ffd966;
  }
  .story-text {
    font-size: 12px;
    line-height: 1.45;
    color: rgba(255,255,255,0.72);
  }

  /* ---------- FLOATS ---------- */
  .float {
    position: absolute;
    pointer-events: none;
    font-weight: 800;
    font-size: 20px;
    color: #ffd966;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8), 0 0 20px rgba(255,217,102,0.5);
    animation: floatUp 0.9s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    z-index: 200;
    transform: translate(-50%, -50%);
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.7); }
    20% { transform: translate(-50%, -70%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -180%) scale(1); }
  }

  /* ---------- TOAST ---------- */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    padding: 16px 28px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(123,92,255,0.95), rgba(180,76,255,0.95));
    color: #fff;
    font-weight: 800;
    font-size: 16px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    z-index: 300;
    box-shadow: 0 20px 60px rgba(123,92,255,0.6);
    border: 1px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
    transition: none;
  }
  .toast.show {
    animation: toastIn 2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
  }
  .toast .t-small {
    font-size: 11px;
    font-weight: 600;
    opacity: 0.8;
    margin-bottom: 3px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  @keyframes toastIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    12% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    22% { transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(0.95); }
  }
</style>
</head>
<body>
<div id="app">

  <div class="header">
    <div class="stage-name" id="stageName">Школьница</div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="score-area">
    <div class="score-value" id="scoreVal">0</div>
    <div class="score-label">пятёрок</div>
    <div class="per-sec" id="perSec">+0/сек</div>
  </div>

  <div class="tap-zone">
    <div class="tap-btn" id="tapBtn">
      <div class="chars" id="chars">
        <div class="char char-v" id="charV">
          <svg viewBox="0 0 200 240">
            <path d="M60 80 Q55 40 100 35 Q145 40 140 80 L148 200 Q145 215 135 200 L132 120 Q128 105 100 102 Q72 105 68 120 L65 200 Q55 215 52 200 Z" fill="#3d2b22"/>

            <path d="M70 115 Q100 105 130 115 L145 200 Q100 210 55 200 Z" fill="#ff6fa5"/>
            <path d="M70 115 Q100 105 130 115 L136 145 Q100 155 64 145 Z" fill="#ff8fb8"/>
            <ellipse cx="100" cy="70" rx="32" ry="35" fill="#f5d5b8"/>
            <path d="M66 62 Q68 32 100 30 Q132 32 134 62 Q128 48 100 46 Q72 48 66 62 Z" fill="#4a3528"/>
            <path d="M66 62 Q70 50 82 46 Q74 56 70 68 Z" fill="#3d2b22"/>
            <ellipse cx="88" cy="70" rx="4" ry="5" fill="#2a1a12"/>

            <ellipse cx="80" cy="82" rx="6" ry="4" fill="#ffb0c0" opacity="0.55"/>
            <ellipse cx="120" cy="82" rx="6" ry="4" fill="#ffb0c0" opacity="0.55"/>
            <path d="M92 85 Q100 92 108 85" stroke="#c96" fill="none" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="char char-s" id="charS">
          <svg viewBox="0 0 200 240">
            <path d="M70 115 Q100 105 130 115 L145 200 Q100 210 55 200 Z" fill="#3a4a6b"/>
            <path d="M85 118 Q100 112 115 118 L112 145 Q100 150 88 145 Z" fill="#4d5f85"/>
            <rect x="88" y="95" width="24" height="20" fill="#f0c9a8"/>
            <ellipse cx="100" cy="70" rx="32" ry="35" fill="#f5d5b8"/>
            <path d="M66 66 Q64 30 100 26 Q136 30 134 66 Q130 50 120 44 Q108 38 96 42 Q80 46 70 60 Z" fill="#a87a4a"/>
            <path d="M100 30 Q80 34 68 50 Q78 44 92 42 Q108 40 120 46 Q112 36 100 30 Z" fill="#946a3e"/>
            <ellipse cx="88" cy="72" rx="4" ry="5" fill="#2a1a12"/>
            <ellipse cx="112" cy="72" rx="4" ry="5" fill="#2a1a12"/>
            <circle cx="89.5" cy="70" r="1.5" fill="#fff"/>
            <circle cx="113.5" cy="70" r="1.5" fill="#fff"/>
            <path d="M82 62 Q88 59 94 62" stroke="#7a5433" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M106 62 Q112 59 118 62" stroke="#7a5433" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M92 88 Q100 94 110 86" stroke="#c96" fill="none" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="55" cy="150" r="4" fill="#ffd966"/>
            <circle cx="140" cy="165" r="3" fill="#ffd966"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="tabs">
      <button class="tab active" data-tab="shop">✨ Улучшения</button>
      <button class="tab" data-tab="story">📖 История</button>
    </div>
    <div class="tab-body" id="tabBody"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(() => {
  'use strict';

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#150e2a'); tg.setBackgroundColor('#0a0615'); } catch(e) {}
  }

  // ---------------- DATA ----------------
  const UPGRADES = [
    { id:'shpora',    icon:'📝', name:'Шпаргалки',              desc:'+1 за тап',        baseCost:15,      type:'tap',     value:1   },
    { id:'repetitor', icon:'👩‍🏫', name:'Репетитор',              desc:'+4 за тап',        baseCost:120,     type:'tap',     value:4   },
    { id:'sasha_help',icon:'💪', name:'Саша Ф подтягивает',     desc:'+15 за тап',       baseCost:900,     type:'tap',     value:15  },
    { id:'frends',    icon:'👯', name:'Друзья по группе',       desc:'+2/сек',           baseCost:80,      type:'passive', value:2   },
    { id:'avito',     icon:'📦', name:'Саша флипает на Авито',  desc:'+12/сек',          baseCost:750,     type:'passive', value:12  },
    { id:'shop',      icon:'🛍️', name:'Магазин брендов',        desc:'+60/сек',          baseCost:5000,    type:'passive', value:60  },
    { id:'office',    icon:'🏙️', name:'Офис в Москва-Сити',     desc:'+300/сек',         baseCost:30000,   type:'passive', value:300 },
    { id:'holding',   icon:'👑', name:'Холдинг «Василиса»',     desc:'+1500/сек',        baseCost:200000,  type:'passive', value:1500},
  ];

  const STAGES = [
    { need:0,          name:'Школьница' },
    { need:120,        name:'Отличница' },
    { need:1200,       name:'Знакомство с Сашей Ф' },
    { need:8000,       name:'Первое свидание' },
    { need:40000,      name:'Поступает в МГУ' },
    { need:200000,     name:'Саша флипает на Авито' },
    { need:1000000,    name:'Свой бизнес' },
    { need:5000000,    name:'Москва-Сити' },
    { need:25000000,   name:'Империя' },
  ];

  const STORY = [
    { title:'Школьница', text:'Василиса — обычная девочка с длинными русыми волосами. Каждый день она садится за уроки и мечтает о большем.' },
    { title:'Отличница', text:'Первый «отлично» в дневнике! Василиса понимает: упорство работает. Пятёрки летят одна за другой.' },
    { title:'Знакомство с Сашей Ф', text:'На перемене к ней подходит Саша Ф — русый парень с чёлкой набок и дрипчиком на груди. «Дай списать?» — «Только если проводишь до дома».' },
    { title:'Первое свидание', text:'Кино, прогулки до полуночи, шаурма у метро. Саша носит её рюкзак, а Василиса улыбается так, что все пятёрки мира меркнут.' },
    { title:'Поступление в МГУ', text:'Экзамены позади. Василиса — студентка МГУ! Саша приносит ей кофе в читалку и обещает: «Мы будем жить в Сити».' },
    { title:'Саша флипает на Авито', text:'Саша Ф нашёл золотую жилу: скупает брендовые вещи на распродажах и перепродаёт на Авито. Деньги текут рекой.' },
    { title:'Свой бизнес', text:'Василиса открывает свой бренд одежды. Саша — директор по закупкам. Всё по-честному, всё по-семейному.' },
    { title:'Москва-Сити', text:'Ключи от квартиры на 60-м этаже. Из окна — весь город. Василиса и Саша стоят обнявшись и смотрят на огни.' },
    { title:'Империя', text:'Теперь это холдинг. Василиса — CEO, Саша — акционер. Они доказали: девочка из школы и парень с дрипчиком могут всё.' },
  ];

  // ---------------- STATE ----------------
  const SAVE_KEY = 'vasilisa_tap_v1';
  let state = {
    score: 0,
    totalEarned: 0,
    stage: 0,
    levels: {},   // id -> level (и для tap, и для passive)
  };

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && typeof d.score === 'number') {
          state = Object.assign(state, d);
        }
      }
    } catch(e) {}
  }
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  // ---------------- HELPERS ----------------
  function fmt(n) {
    n = Math.floor(n);
    if (n < 1000) return n.toString();
    if (n < 1e6)  return (n/1000).toFixed(n < 10000 ? 1 : 0).replace('.0','') + 'K';
    if (n < 1e9)  return (n/1e6).toFixed(n < 1e7 ? 1 : 0).replace('.0','') + 'M';
    return (n/1e9).toFixed(1).replace('.0','') + 'B';
  }

  function getCost(item) {
    const lvl = state.levels[item.id] || 0;
    return Math.floor(item.baseCost * Math.pow(1.6, lvl));
  }

  function getTapValue() {
    let v = 1;
    for (const u of UPGRADES) {
      if (u.type === 'tap') v += u.value * (state.levels[u.id] || 0);
    }
    return v;
  }

  function getPassive() {
    let v = 0;
    for (const u of UPGRADES) {
      if (u.type === 'passive') v += u.value * (state.levels[u.id] || 0);
    }
    return v;
  }

  // ---------------- DOM ----------------
  const $ = id => document.getElementById(id);
  const scoreEl   = $('scoreVal');
  const perSecEl  = $('perSec');
  const stageEl   = $('stageName');
  const progEl    = $('progressFill');
  const tapBtn    = $('tapBtn');
  const charsEl   = $('chars');
  const tabBody   = $('tabBody');
  const toastEl   = $('toast');

  let currentTab = 'shop';
  let shopBuilt = false;

  // ---------------- STAGE / UI ----------------
  function checkStage() {
    let newStage = state.stage;
    for (let i = STAGES.length - 1; i >= 0; i--) {
      if (state.totalEarned >= STAGES[i].need) { newStage = i; break; }
    }
    if (newStage > state.stage) {
      state.stage = newStage;
      showToast('НОВЫЙ ЭТАП', STAGES[newStage].name);
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      updateDuo();
      if (currentTab === 'story') renderStory();
    }
  }

  function updateDuo() {
    // Саша появляется на этапе "Знакомство с Сашей Ф" (индекс 2)
    if (state.stage >= 2) charsEl.classList.add('duo');
    else charsEl.classList.remove('duo');
  }

  function showToast(small, big) {
    toastEl.innerHTML = `<div class="t-small">${small}</div>${big}`;
    toastEl.classList.remove('show');
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
  }

  function updateHeader() {
    stageEl.textContent = STAGES[state.stage].name;
    const cur = STAGES[state.stage];
    const next = STAGES[state.stage + 1];
    if (next) {
      const pct = Math.min(100, ((state.totalEarned - cur.need) / (next.need - cur.need)) * 100);
      progEl.style.width = pct + '%';
    } else {
      progEl.style.width = '100%';
    }
  }

  function updateScore(bump) {
    scoreEl.textContent = fmt(state.score);
    if (bump) {
      scoreEl.classList.add('bump');
      clearTimeout(scoreEl._t);
      scoreEl._t = setTimeout(() => scoreEl.classList.remove('bump'), 90);
    }
    perSecEl.textContent = '+' + fmt(getPassive()) + '/сек';
  }

  // ---------------- SHOP ----------------
  function buildShop() {
    tabBody.innerHTML = '';
    const wrap = document.createElement('div');
    for (const u of UPGRADES) {
      const el = document.createElement('div');
      el.className = 'item';
      el.dataset.id = u.id;
      el.innerHTML = `
        <div class="item-icon">${u.icon}</div>
        <div class="item-info">
          <div class="item-name">${u.name}</div>
          <div class="item-desc">${u.desc}</div>
          <div class="item-lvl">Ур. <span class="lvl">0</span></div>
        </div>
        <button class="buy-btn">⭐ 0</button>
      `;
      const btn = el.querySelector('.buy-btn');
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        buy(u, el, btn);
      });
      u._el = el;
      u._btn = btn;
      u._lvl = el.querySelector('.lvl');
      wrap.appendChild(el);
    }
    tabBody.appendChild(wrap);
    shopBuilt = true;
    updateShop();
  }

  function updateShop() {
    if (!shopBuilt) return;
    for (const u of UPGRADES) {
      const lvl = state.levels[u.id] || 0;
      const cost = getCost(u);
      u._lvl.textContent = lvl;
      const canAfford = state.score >= cost;
      u._btn.textContent = '⭐ ' + fmt(cost);
      u._btn.classList.toggle('disabled', !canAfford);
      u._el.classList.toggle('affordable', canAfford);
    }
  }

  function buy(u, el, btn) {
    const cost = getCost(u);
    if (state.score < cost) return;
    state.score -= cost;
    state.levels[u.id] = (state.levels[u.id] || 0) + 1;

    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

    // маленький эффект
    el.animate(
      [{ transform:'scale(1)' }, { transform:'scale(1.03)' }, { transform:'scale(1)' }],
      { duration: 220, easing:'ease-out' }
    );

    updateScore(true);
    updateShop();
    updateHeader();
    save();
  }

  // ---------------- STORY ----------------
  function renderStory() {
    tabBody.innerHTML = '';
    STORY.forEach((s, i) => {
      const unlocked = state.totalEarned >= STAGES[i].need;
      const el = document.createElement('div');
      el.className = 'story-item' + (unlocked ? '' : ' locked');
      el.innerHTML = `
        <div class="story-title"><span class="dot"></span>${s.title}</div>
        <div class="story-text">${unlocked ? s.text : '🔒 Откроется на этапе «' + STAGES[i].name + '»'}</div>
      `;
      tabBody.appendChild(el);
    });
  }

  // ---------------- TABS ----------------
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === tab);
    });
    tabBody.scrollTop = 0;
    if (tab === 'shop') {
      buildShop();
    } else {
      shopBuilt = false;
      renderStory();
    }
  }

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });

  // ---------------- TAP ----------------
  const appEl = $('app');

  function spawnFloat(clientX, clientY, text) {
    const r = appEl.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'float';
    el.textContent = text;
    el.style.left = (clientX - r.left) + 'px';
    el.style.top  = (clientY - r.top) + 'px';
    appEl.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  function doTap(clientX, clientY) {
    const gain = getTapValue();
    state.score += gain;
    state.totalEarned += gain;

    spawnFloat(clientX, clientY, '+' + fmt(gain));

    tapBtn.classList.remove('pulse');
    void tapBtn.offsetWidth;
    tapBtn.classList.add('pulse');

    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

    updateScore(true);
    checkStage();
    updateHeader();
    if (currentTab === 'shop') updateShop();
  }

  tapBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    doTap(e.clientX, e.clientY);
  }, { passive: false });

  // ---------------- LOOP ----------------
  setInterval(() => {
    const p = getPassive();
    if (p > 0) {
      state.score += p;
      state.totalEarned += p;
      updateScore(false);
      checkStage();
      updateHeader();
      if (currentTab === 'shop') updateShop();
    }
  }, 1000);

  // автосейв
  setInterval(save, 4000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);

  // ---------------- INIT ----------------
  load();
  updateDuo();
  updateHeader();
  updateScore(false);
  buildShop();
})();
</script>
</body>
</html>
